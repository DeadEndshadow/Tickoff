events {
    worker_connections 1024;
}

http {
    # ─── Upstreams ───────────────────────────────────────────────────────────

    upstream auth_service {
        server auth-service:3001;
    }

    upstream tickmap_service {
        server tickmap-service:3002;
    }

    upstream push_service {
        server push-service:3003;
    }

    upstream user_service {
        server user-service:3004;
    }

    upstream firebase_emulator {
        server firebase-emulator:4000;
    }

    upstream mock_api {
        server mock-api:8080;
    }

    # ─── Common proxy headers macro ──────────────────────────────────────────

    server {
        listen 80;
        server_name localhost;

        # CORS preflight
        location / {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization';
                return 204;
            }
            return 200 'TickOff Backend\n';
            add_header Content-Type text/plain;
        }

        # ─── Authentication Service (central gateway) ─────────────────────
        location /auth/ {
            proxy_pass http://auth_service/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
        }

        # ─── TickMap Service ──────────────────────────────────────────────
        location /api/hotspots {
            proxy_pass http://tickmap_service/api/hotspots;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
        }

        location /api/reports {
            proxy_pass http://tickmap_service/api/reports;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
        }

        # ─── Push Notification Service ────────────────────────────────────
        location /api/notifications/ {
            proxy_pass http://push_service/api/notifications/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
        }

        # ─── User Service ─────────────────────────────────────────────────
        location /api/users/ {
            proxy_pass http://user_service/api/users/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
        }

        # ─── Firebase Emulator UI ─────────────────────────────────────────
        location /firebase/ {
            proxy_pass http://firebase_emulator/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ─── Legacy Mock API ──────────────────────────────────────────────
        location /api/ {
            proxy_pass http://mock_api/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
        }

        # ─── Health checks ────────────────────────────────────────────────
        location /health {
            proxy_pass http://mock_api/health;
            proxy_set_header Host $host;
        }

        location /health/auth {
            proxy_pass http://auth_service/health;
            proxy_set_header Host $host;
        }

        location /health/tickmap {
            proxy_pass http://tickmap_service/health;
            proxy_set_header Host $host;
        }

        location /health/push {
            proxy_pass http://push_service/health;
            proxy_set_header Host $host;
        }

        location /health/users {
            proxy_pass http://user_service/health;
            proxy_set_header Host $host;
        }
    }
}
