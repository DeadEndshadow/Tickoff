events {
    worker_connections 1024;
}

http {
    upstream firebase_emulator {
        server firebase-emulator:4000;
    }

    upstream mock_api {
        server mock-api:8080;
    }

    upstream auth_service {
        server auth-service:3001;
    }

    upstream tickmap_service {
        server tickmap-service:3002;
    }

    # ── CORS helper macro ───────────────────────────────────────────────────────
    map $request_method $cors_method {
        OPTIONS  "preflight";
        default  "normal";
    }

    server {
        listen 80;
        server_name localhost;

        # ── Auth Service ────────────────────────────────────────────────────────
        location /auth/ {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
                return 204;
            }
            proxy_pass http://auth_service/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
        }

        # ── TickMap Service ─────────────────────────────────────────────────────
        location /api/ {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
                return 204;
            }
            proxy_pass http://tickmap_service/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
        }

        # ── Firebase Emulator UI ────────────────────────────────────────────────
        location /firebase/ {
            proxy_pass http://firebase_emulator/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Health check ────────────────────────────────────────────────────────
        location /health {
            proxy_pass http://tickmap_service/health;
            proxy_set_header Host $host;
        }

        # ── Default ─────────────────────────────────────────────────────────────
        location / {
            return 200 'TickOff Gateway\n';
            add_header Content-Type text/plain;
        }
    }
}
