global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Analytics Service (Python/Flask)
  - job_name: analytics-service
    static_configs:
      - targets: ["analytics-service:8090"]
    metrics_path: /metrics

  # Auth Service (Node.js/Express)
  - job_name: auth-service
    static_configs:
      - targets: ["auth-service:3001"]
    metrics_path: /metrics

  # TickMap Service (Node.js/Express)
  - job_name: tickmap-service
    static_configs:
      - targets: ["tickmap-service:3002"]
    metrics_path: /metrics

  # Kafka metrics via kafka-exporter
  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]

  # PostgreSQL metrics
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # Prometheus itself
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]