version: '3.8'

services:
  # Firebase Emulator Suite
  firebase-emulator:
    image: andreysenov/firebase-tools:latest
    container_name: tickoff-firebase-emulator
    ports:
      - "4000:4000"   # Emulator UI
      - "9099:9099"   # Firestore
      - "9199:9199"   # Storage
      - "5001:5001"   # Functions
      - "8085:8085"   # Auth
    volumes:
      - ./firebase.json:/home/node/firebase.json
      - ./firestore.rules:/home/node/firestore.rules
      - firebase-data:/home/node/.firebase
    command: firebase emulators:start --project=tickoff-test
    networks:
      - tickoff-network
    restart: unless-stopped

  # Mock API Server (Node.js)
  mock-api:
    image: node:20-alpine
    container_name: tickoff-mock-api
    working_dir: /app
    ports:
      - "8080:8080"
    volumes:
      - ./mock-api:/app
    command: sh -c "npm install && node server.js"
    environment:
      - NODE_ENV=development
      - PORT=8080
      - RABBITMQ_URL=amqp://tickoff:tickoff@rabbitmq:5672
    networks:
      - tickoff-network
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # Test Database (PostgreSQL for test data)
  test-db:
    image: postgres:15-alpine
    container_name: tickoff-test-db
    environment:
      - POSTGRES_DB=tickoff_test
      - POSTGRES_USER=tickoff_user
      - POSTGRES_PASSWORD=tickoff_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - tickoff-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tickoff_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Message Queue (RabbitMQ)
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: tickoff-rabbitmq
    ports:
      - "5672:5672"   # AMQP protocol
      - "15672:15672" # Management UI (http://localhost:15672)
    environment:
      - RABBITMQ_DEFAULT_USER=tickoff
      - RABBITMQ_DEFAULT_PASS=tickoff
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - tickoff-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Analytics Service (Python)
  analytics-service:
    build:
      context: ./analytics-service
      dockerfile: Dockerfile
    container_name: tickoff-analytics
    ports:
      - "8090:8090"   # Analytics REST API
    environment:
      - RABBITMQ_URL=amqp://tickoff:tickoff@rabbitmq:5672
      - POSTGRES_URL=postgresql://tickoff_user:tickoff_password@test-db:5432/tickoff_test
      - PORT=8090
    networks:
      - tickoff-network
    depends_on:
      rabbitmq:
        condition: service_healthy
      test-db:
        condition: service_healthy
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: tickoff-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - mock-api
      - firebase-emulator
      - analytics-service
    networks:
      - tickoff-network
    restart: unless-stopped

networks:
  tickoff-network:
    driver: bridge

volumes:
  firebase-data:
  postgres-data:
  rabbitmq-data: