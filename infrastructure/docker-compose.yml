services:
  # ─── Message Queue ──────────────────────────────────────────────────────────

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: tickoff-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - tickoff-network
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: tickoff-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - tickoff-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ─── Database ───────────────────────────────────────────────────────────────

  postgres:
    image: postgres:15-alpine
    container_name: tickoff-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - tickoff-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Firebase Emulator ──────────────────────────────────────────────────────

  firebase-emulator:
    image: andreysenov/firebase-tools:latest
    container_name: tickoff-firebase-emulator
    ports:
      - "4000:4000"
      - "9099:9099"
      - "9199:9199"
      - "5001:5001"
      - "8085:8085"
    volumes:
      - ./firebase.json:/home/node/firebase.json
      - ./firestore.rules:/home/node/firestore.rules
      - firebase-data:/home/node/.firebase
    command: firebase emulators:start --project=tickoff-test
    networks:
      - tickoff-network
    restart: unless-stopped

  # ─── Backend Services ───────────────────────────────────────────────────────
  # TODO: uncomment when backend/ folder exists (Terence / Tharun / Luca)

  # auth-service:
  #   build:
  #     context: ../backend
  #     dockerfile: auth-service/Dockerfile

  # tickmap-service:
  #   build:
  #     context: ../backend
  #     dockerfile: tickmap-service/Dockerfile

  # push-service:
  #   build:
  #     context: ../backend
  #     dockerfile: push-service/Dockerfile

  # user-service:
  #   build:
  #     context: ../backend
  #     dockerfile: user-service/Dockerfile

  # ─── Analytics Service (Sebastian) ─────────────────────────────────────────

  analytics-service:
    build:
      context: ./analytics-service
      dockerfile: Dockerfile
    container_name: tickoff-analytics
    ports:
      - "8090:8090"
    environment:
      - KAFKA_BROKERS=kafka:29092
      - KAFKA_TOPIC=tickoff.events
      - POSTGRES_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - PORT=8090
    networks:
      - tickoff-network
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ─── Mock API (testing) ─────────────────────────────────────────────────────

  mock-api:
    image: node:20-alpine
    container_name: tickoff-mock-api
    working_dir: /app
    ports:
      - "8080:8080"
    volumes:
      - ./mock-api:/app
    command: sh -c "npm install && node server.js"
    environment:
      - NODE_ENV=development
      - PORT=8080
      - KAFKA_BROKERS=kafka:29092
    networks:
      - tickoff-network
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # ─── Monitoring ─────────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: tickoff-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    networks:
      - tickoff-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.0
    container_name: tickoff-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - tickoff-network
    depends_on:
      - prometheus
    restart: unless-stopped

  # Kafka metrics exporter
  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: tickoff-kafka-exporter
    command:
      - "--kafka.server=kafka:29092"
    ports:
      - "9308:9308"
    networks:
      - tickoff-network
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # PostgreSQL metrics exporter
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: tickoff-postgres-exporter
    ports:
      - "9187:9187"
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    networks:
      - tickoff-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ─── Nginx Reverse Proxy ────────────────────────────────────────────────────

  nginx:
    image: nginx:alpine
    container_name: tickoff-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - mock-api
      - firebase-emulator
      - analytics-service
    networks:
      - tickoff-network
    restart: unless-stopped

networks:
  tickoff-network:
    driver: bridge

volumes:
  firebase-data:
  postgres-data:
  prometheus-data:
  grafana-data: