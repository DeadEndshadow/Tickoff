services:
  # ─── Message Queue ──────────────────────────────────────────────────────────

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: tickoff-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - tickoff-network
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: tickoff-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - tickoff-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ─── Database ───────────────────────────────────────────────────────────────

  postgres:
    image: postgres:15-alpine
    container_name: tickoff-postgres
    environment:
      - POSTGRES_DB=tickoff
      - POSTGRES_USER=tickoff_user
      - POSTGRES_PASSWORD=tickoff_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - tickoff-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tickoff_user -d tickoff"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Firebase Emulator ──────────────────────────────────────────────────────

  firebase-emulator:
    image: andreysenov/firebase-tools:latest
    container_name: tickoff-firebase-emulator
    ports:
      - "4000:4000"   # Emulator UI
      - "9099:9099"   # Firestore
      - "9199:9199"   # Storage
      - "5001:5001"   # Functions
      - "8085:8085"   # Auth
    volumes:
      - ./firebase.json:/home/node/firebase.json
      - ./firestore.rules:/home/node/firestore.rules
      - firebase-data:/home/node/.firebase
    command: firebase emulators:start --project=tickoff-test
    networks:
      - tickoff-network
    restart: unless-stopped

  # ─── Backend Services ───────────────────────────────────────────────────────

  auth-service:
    build:
      context: ../backend
      dockerfile: auth-service/Dockerfile
    container_name: tickoff-auth-service
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - AUTH_SERVICE_PORT=3001
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=tickoff
      - POSTGRES_USER=tickoff_user
      - POSTGRES_PASSWORD=tickoff_password
      - JWT_SECRET=${JWT_SECRET:-tickoff-jwt-secret-dev}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-tickoff-refresh-secret-dev}
      - JWT_EXPIRY=${JWT_EXPIRY:-15m}
      - JWT_REFRESH_EXPIRY=${JWT_REFRESH_EXPIRY:-7d}
      - KAFKA_BROKERS=kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - tickoff-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  tickmap-service:
    build:
      context: ../backend
      dockerfile: tickmap-service/Dockerfile
    container_name: tickoff-tickmap-service
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - TICKMAP_SERVICE_PORT=3002
      - FIREBASE_PROJECT_ID=tickoff-test
      - FIRESTORE_EMULATOR_HOST=firebase-emulator:9099
      - KAFKA_BROKERS=kafka:29092
    depends_on:
      firebase-emulator:
        condition: service_started
      kafka:
        condition: service_healthy
    networks:
      - tickoff-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  push-service:
    build:
      context: ../backend
      dockerfile: push-service/Dockerfile
    container_name: tickoff-push-service
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=production
      - PUSH_SERVICE_PORT=3003
      - FIREBASE_PROJECT_ID=tickoff-test
      - KAFKA_BROKERS=kafka:29092
      - FCM_SERVER_KEY=${FCM_SERVER_KEY:-}
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - tickoff-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3003/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  user-service:
    build:
      context: ../backend
      dockerfile: user-service/Dockerfile
    container_name: tickoff-user-service
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=production
      - USER_SERVICE_PORT=3004
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=tickoff
      - POSTGRES_USER=tickoff_user
      - POSTGRES_PASSWORD=tickoff_password
      - KAFKA_BROKERS=kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - tickoff-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3004/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ─── Analytics Service (Sebastian) ─────────────────────────────────────────

  analytics-service:
    build:
      context: ./analytics-service
      dockerfile: Dockerfile
    container_name: tickoff-analytics
    ports:
      - "8090:8090"
    environment:
      - KAFKA_BROKERS=kafka:29092
      - KAFKA_TOPIC=tickoff.events
      - POSTGRES_URL=postgresql://tickoff_user:tickoff_password@postgres:5432/tickoff
      - PORT=8090
    networks:
      - tickoff-network
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ─── Mock API (testing) ─────────────────────────────────────────────────────

  mock-api:
    image: node:20-alpine
    container_name: tickoff-mock-api
    working_dir: /app
    ports:
      - "8080:8080"
    volumes:
      - ./mock-api:/app
    command: sh -c "npm install && node server.js"
    environment:
      - NODE_ENV=development
      - PORT=8080
      - KAFKA_BROKERS=kafka:29092
    networks:
      - tickoff-network
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # ─── Nginx Reverse Proxy ────────────────────────────────────────────────────

  nginx:
    image: nginx:alpine
    container_name: tickoff-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - tickmap-service
      - push-service
      - user-service
      - mock-api
      - firebase-emulator
      - analytics-service
    networks:
      - tickoff-network
    restart: unless-stopped

networks:
  tickoff-network:
    driver: bridge

volumes:
  firebase-data:
  postgres-data: